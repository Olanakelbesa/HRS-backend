services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart-rental-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-house_rental}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}' ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-rental-redis


    
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-rental-backend
    ports:
      - '8080:${PORT:-5000}'
    environment:
      PORT: ${PORT:-5000}
      NODE_ENV: ${NODE_ENV:-production}
      # DATABASE_URL from .env takes priority (Neon cloud DB).
      # Remove DATABASE_URL from .env to use the local Docker postgres container instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-house_rental}}
      DIRECT_URL: ${DIRECT_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-house_rental}}

      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      GOOGLE_EMAIL_USER: ${GOOGLE_EMAIL_USER}
      GOOGLE_EMAIL_PASS: ${GOOGLE_EMAIL_PASS}

      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      CHAPA_ENCRIPTION_KEY: ${CHAPA_ENCRIPTION_KEY}
      CHAPA_PUBLICK_KEY: ${CHAPA_PUBLICK_KEY}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embedding-service:8000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_started
    restart: unless-stopped

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: smart-rental-bge
    ports:
      - '${EMBEDDING_PORT:-8000}:8000'
    restart: unless-stopped

  recommendation-db:
    image: postgres:16-alpine
    container_name: smart-rental-rec-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-recommendations}
    ports:
      - '${RECOMMENDATION_DB_PORT:-5433}:5432'
    volumes:
      - rec_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}' ]
      interval: 5s
      timeout: 5s
      retries: 5

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: smart-rental-recommendations
    ports:
      - '8001:8001'
    environment:
      MAIN_DB_URL: postgresql://postgres:postgres@postgres:5432/${POSTGRES_DB:-house_rental}
      RECOMMENDATION_DB_URL: postgresql://postgres:postgres@recommendation-db:5432/recommendations
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      recommendation-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rec_db_data:
